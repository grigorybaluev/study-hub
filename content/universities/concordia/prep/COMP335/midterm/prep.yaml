# Study guide for the COMP 335 midterm (#262): weeks 1-6, regular languages and the start of
# context-free grammars.
exam: Midterm
summary: >-
  Which languages can a machine with a fixed, finite memory recognise? The regular languages: four
  descriptions of them, the conversions between all four, the operations that keep a language
  regular, and how to prove that one is not. Week 6 starts context-free grammars, which can count.
format: >-
  Sunday 25 October, 10:30–12:00, in person, common to all sections; 25 % of the grade. **Part A**:
  detailed solutions (about 25 % of the test). **Part B**: multiple choice (about 75 %). Most marks
  are for recognising things quickly and correctly; a few problems are worked in full.
maps: [regular-language-representations]
types_intro: |
  Nine types of problem. For each: the reasoning, the steps, the traps, worked problems and a
  multiple-choice drill. Part B samples every type; Part A is a few of them worked in full.

  :::insight[The one idea behind all nine types]
  **Finite memory.** To design: decide what must be remembered, and each possibility is a state. To
  convert: track the right finite information (sets of states, pairs of states, labels on edges). To
  prove "not regular": show that infinitely many different things must be remembered; the pumping
  lemma does this with the pigeonhole principle.
  :::

  :::steps[How to write a Part A answer]
  1. Say what each state means ("$q_1$: the last symbol read was $a$"). This is the proof that your DFA
     is right, and graders look for it.
  2. Draw the complete machine: mark the start arrow and the final states, and include the trap state
     (or say "missing moves go to a trap").
  3. For a conversion, show the table (subset construction, mark table, eliminated states), not only
     the result.
  4. Test two strings in $L$ and two outside, including $\lambda$ and the shortest strings.
  :::

  :::note[Multiple choice: fast and right]
  - Test with tiny strings first: $\lambda$, $a$, $b$, $ab$, $ba$, $aa$. Most wrong options fail on one
    of them.
  - "Which expression equals $L$?" Find a string in one but not the other. One counterexample kills an
    option.
  - "Is $L$ regular?" Does recognising $L$ need an unbounded count or a comparison between two parts?
    If not (counting mod $k$, bounded counts, finite), it is regular.
  :::
plan:
  - id: definitions
    title: Definitions to know exactly
    items:
      - "DFA $(Q,\\Sigma,\\delta,q_0,F)$ with a total $\\delta$; $\\delta^*$; $L(M)$"
      - "NFA $\\delta: Q\\times(\\Sigma\\cup\\{\\lambda\\})\\to 2^Q$; acceptance means $\\delta^*(q_0,w)\\cap F\\neq\\varnothing$"
      - indistinguishable states; the mark procedure
      - "regular expression syntax and precedence ($^*$, then concatenation, then $+$)"
      - "right-linear $A\\to xB\\mid x$; left-linear $A\\to Bx\\mid x$"
      - "homomorphism; right quotient $L_1/L_2$"
      - "pumping lemma: $|xy|\\le m$, $|y|\\ge 1$, $xy^iz\\in L$ for all $i\\ge 0$"
      - "context-free rule $A\\to x$, $x\\in(V\\cup T)^*$; leftmost derivation; ambiguity"
  - id: traps
    title: The ten traps, one line each
    items:
      - "$\\varnothing^*=\\{\\lambda\\}$; $\\varnothing L=\\varnothing$; $L^+=L^*$ when $\\lambda\\in L$."
      - Complete the DFA (trap state) before complementing or minimising.
      - "Substring DFA: on a mismatch, keep the longest useful suffix."
      - "$\\lambda$-closure after every move and at the start."
      - "Minimisation: remove unreachable states; repeat passes until stable."
      - "Precedence: $ab^*$ is $a(b^*)$; test $\\lambda$ against every expression."
      - Never mix right- and left-linear rules.
      - "Closure only works forwards; subsets of regular languages can be anything."
      - "Pumping: $w$ depends on $m$, the split is not yours, cover every $k$."
      - "Finite means regular; check what $L^*$ contains before calling it non-regular."
  - id: evening
    title: If you have one evening
    items:
      - "Redo [One but not both](/prep/COMP335/midterm/types/design-a-dfa) without the solution."
      - "Redo [The second symbol from the end](/prep/COMP335/midterm/types/nfa-subset-construction): NFA, then the subset table."
      - "Redo [Seven states down to three](/prep/COMP335/midterm/types/minimise-a-dfa): the full mark table."
      - "Redo [State elimination](/prep/COMP335/midterm/types/regular-expressions) and the fixed-point exercise in [Regular grammars](/prep/COMP335/midterm/types/regular-grammars)."
      - "Redo the prefix construction in [Closure and decisions](/prep/COMP335/midterm/types/closure-and-decisions)."
      - "Redo both [pumping proofs and Decide first](/prep/COMP335/midterm/types/regular-or-not)."
      - "Walk the [conversion map](/prep/COMP335/midterm/map) example once, then answer three of its questions from memory."
      - "Clear the exam's review deck."
