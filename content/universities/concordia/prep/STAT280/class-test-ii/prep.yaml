# Study guide for STAT 280 Class Test II (#280): weeks 6-10, programming practice and simulation.
exam: Class test II
summary: >-
  To learn about a random quantity, simulate it many times and average. Weeks 6–7 are how to write that
  repetition well: replicate(), design, debugging, speed. Weeks 8–10 are where the random numbers come from:
  pseudorandom uniforms, every other distribution built from them, Markov chains one step at a time, and integrals
  written as expected values.
format: >-
  In class: Tuesday 17 November for section D, Wednesday 18 November for section A. Closed book. 30 % of the final
  grade. Weeks 6–10: replicate, programming guidelines, debugging and maintenance, efficient programming, Monte Carlo
  simulation, pseudorandom numbers, simulating random variables, multivariate generation, Markov chains, Monte Carlo
  integration and advanced simulation methods. The course outline gives no length, number of questions or calculator
  rule.
maps: [simulating-a-distribution, monte-carlo-estimates, markov-chain-routes]
types_intro: |
  Eleven types of problem. For each: the reasoning, the steps, the traps, and worked problems with "pattern at
  work". Every topic of weeks 6–10 has a type, since the outline does not say how the marks are split. The test is
  closed book, so the function names, their arguments and the formulas have to be in your head: practise writing
  each line of R from memory, and reading a short piece of code to say what it returns.

  :::insight[The one idea behind all eleven types]
  **Simulate it many times and average.** Types 1–3 are about writing that repetition well. Types 4 and 6–9, and
  rejection in type 11, are about getting draws from the right distribution, starting from uniforms. Types 5 and 10,
  and importance sampling in type 11, turn draws into a number: every probability, integral or volume is an expected
  value, so its estimate is a mean, and the error is $s/\sqrt n$.
  :::

  :::steps[How to write every answer]
  1. Say what is being computed, as a formula: $P(X>4)$, $E[g(U)]$, $F^{-1}(u)$, $\pi P=\pi$.
  2. Write the line of R with the arguments in the right order, named when in doubt: `rbinom(n, size = 12, prob = 0.3)`.
  3. Work a small case by hand: the first steps of a generator, the first pass of a loop, one row of a matrix.
  4. Give an exact value where one exists, and compare: mean, variance, acceptance rate, $\pi$.
  5. An estimate comes with its error: `sd(y) / sqrt(n)`, with the constant in front carried along.
  :::
plan:
  - id: formulas
    title: Formulas to know cold
    items:
      - '$\bar X\pm1.96\,s/\sqrt n$; the error falls like $1/\sqrt n$; $n=(1.96\,s/w)^2$'
      - '$x_n=b\,x_{n-1}\bmod m$, $u_n=x_n/m$; period at most $m-1$; uniform on $(0,1)$: mean $\tfrac12$, variance $\tfrac1{12}$'
      - 'Bernoulli: $p$, $p(1-p)$; binomial: $np$, $np(1-p)$; Poisson: $\lambda$, $\lambda$; exponential: $1/\lambda$, $1/\lambda^2$'
      - 'Inverse transform: $X=F^{-1}(U)$; exponential: $-\log(1-U)/\lambda$'
      - 'Correlated normals: $Y=\rho Z_1+\sqrt{1-\rho^2}\,Z_2$; $\Sigma=R^{\mathsf T}R$; chi-square with $k$ degrees of freedom: mean $k$, variance $2k$'
      - 'Markov: rows sum to 1; $n$ steps $=P^n$; $p_n=p_0P^n$; $\pi P=\pi$ with total 1'
      - 'Sample mean: $\int_a^bg\approx(b-a)\,\bar g$, error $(b-a)\,s_g/\sqrt n$; hit-or-miss: box $\times$ fraction under the curve'
      - 'Other densities: $\int g=E[g(X)/f(X)]$; rejection: $k\,g\le f$, accept if $U\,f(X)<k\,g(X)$, rate $k$ for a normalised $g$; importance: $w=g/f$'
  - id: r-names
    title: R to write from memory
    items:
      - '`replicate(n, expr)`, `sapply(x, f)`, `set.seed(k)`, `runif(n, a, b)`, `sample(x, size, replace, prob)`'
      - '`dbinom`, `pbinom`, `qbinom`, `rbinom` with `size`, `prob`; the same with `pois` (`lambda`), `exp` (`rate`), `norm` (`mean`, `sd`)'
      - '`cumsum`, `findInterval`, `pmax`, `pmin`, `ifelse`, `rowSums`, `colMeans`, `sweep`, `table`, `weighted.mean`'
      - '`%%`, `%/%`, `%*%`, `t()`, `diag()`, `chol()`, `eigen()`, `matrix(..., byrow = TRUE)`'
      - '`stopifnot()`, `traceback()`, `browser()`, `debug()`, `undebug()`, `system.time()`, `Rprof()`, `identical()`, `integrate()`'
  - id: traps
    title: The twelve traps, one line each
    items:
      - 'The random call goes inside `replicate()`; `replicate()` returns repetitions as **columns**.'
      - '`1:length(x)` on an empty `x` runs twice; `seq_along(x)` does not run at all.'
      - 'Growing with `c()` in a loop copies everything; pre-allocate with `numeric(n)`.'
      - '`max()` is one number; `pmax()` is element by element.'
      - '`ceiling(k * u)`, never `round(k * u)`, for integers from uniforms.'
      - '$s/\sqrt n$ is the error of the estimate; $s$ alone does not shrink.'
      - 'Discrete: $P(X<3)$ is `pbinom(2, ...)`, and $P(X>4)$ is `1 - pbinom(4, ...)`.'
      - '`rexp` takes the rate, not the mean; `rnorm` takes `sd`, not the variance.'
      - 'Keep the root of $u=F(x)$ that lies in the support.'
      - '`P^2` squares entries; `P %*% P` is the matrix product. **Rows** sum to 1; the eigenvector is that of `t(P)`.'
      - 'The factor $(b-a)$ of the sample mean, and the box measure of hit-or-miss.'
      - '$k\,g\le f$ on the whole support; with $g/f$ unbounded, the standard error cannot be trusted.'
  - id: evening
    title: If you have one evening
    items:
      - 'Redo [A window that is one too wide](/prep/STAT280/class-test-ii/types/design-and-debugging) on paper: trace first, then fix.'
      - 'Redo [Three small generators](/prep/STAT280/class-test-ii/types/pseudorandom-generators) by hand, with the period of each.'
      - 'Redo [The smaller of two uniforms](/prep/STAT280/class-test-ii/types/monte-carlo-estimates) and [How many draws?](/prep/STAT280/class-test-ii/types/monte-carlo-estimates).'
      - 'Redo [Which function?](/prep/STAT280/class-test-ii/types/discrete-simulation) from memory, all seven lines.'
      - 'Redo [A rising density](/prep/STAT280/class-test-ii/types/inverse-transform) and [A piecewise density](/prep/STAT280/class-test-ii/types/inverse-transform), from $f$ to the line of R.'
      - 'Redo [A machine by hand](/prep/STAT280/class-test-ii/types/markov-chains): $P$, $P^2$, $\pi$.'
      - 'Redo [Two ways to the same integral](/prep/STAT280/class-test-ii/types/monte-carlo-integration) and [An exponential envelope](/prep/STAT280/class-test-ii/types/rejection-importance).'
      - 'Walk the three [maps](/prep/STAT280/class-test-ii/map) once, then answer three of their questions from memory.'
      - "Clear the exam's review deck."
