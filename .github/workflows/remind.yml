# Review reminders (#224, #235): pushes to the owner's phone in the breaks of the day. Each morning an iOS
# Shortcut on the phone sends the day's busy blocks from its calendar (times only, no titles) to the repo
# variable REMIND_DAY; this workflow checks every 10 minutes whether one of the day's reminder times
# (scripts/remind-slots.mjs) has come, and falls back to 9:00 and 20:00 Montreal time on a day the phone
# sent nothing. Sunday at 23:00 it sends the week's summary (#243). Run logs are public, and a step's env is printed in them: the script reads REMIND_DAY
# through the API with the secret REMIND_TOKEN (the phone's token: Variables, read and write, this repo
# only), never vars.REMIND_DAY here, and every run takes the same steps and prints nothing about the times.
# The phone's subscription is the secret PUSH_SUBSCRIPTION (copied from the stats page), the VAPID pair the
# secrets VAPID_PUBLIC_KEY and VAPID_PRIVATE_KEY. The push is empty: the app's service worker writes the
# day's progress (public/push-sw.js, #242). "Run workflow" sends one now. A failed send fails the run, so
# GitHub mails the owner. GitHub may start a scheduled run late or skip it (the next run covers it), and
# turns schedules off in a repo with no commits for 60 days.
name: Review reminder

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "remind: the day's progress; week: the Sunday summary"
        type: choice
        options: [remind, week]
        default: remind

permissions:
  actions: read       # the previous run's start (scripts/remind.mjs)
  contents: read

# one run at a time: each covers the time since the previous one started
concurrency: remind

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # web-push, kept between runs (whether a run sends or not, the steps are the same)
      - uses: actions/cache@v4
        id: deps
        with:
          path: node_modules
          key: web-push-3.6.7
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm install --silent --no-save --no-package-lock --no-audit --no-fund web-push@3.6.7
      - name: Send the push if a reminder is due
        env:
          TZ: America/Toronto
          EVENT: ${{ github.event_name }}
          KIND: ${{ inputs.kind }}
          GH_TOKEN: ${{ github.token }}
          REMIND_TOKEN: ${{ secrets.REMIND_TOKEN }}
          SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node scripts/remind.mjs
