<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Study Hub app icon: a card in front of a card, a small concept graph on it.
       Full-bleed square (iOS and maskable icons crop it); the drawing stays inside the central safe zone. -->
  <rect width="512" height="512" fill="#0f0e23"/>
  <rect x="150" y="136" width="196" height="244" rx="24" fill="#2c2b4d" transform="rotate(-11 248 258)"/>
  <rect x="168" y="138" width="196" height="244" rx="24" fill="#f7f6f2" transform="rotate(7 266 260)"/>
  <g transform="rotate(7 266 260)" stroke="#0f0e23" stroke-width="10" stroke-linecap="round">
    <line x1="220" y1="198" x2="310" y2="214"/>
    <line x1="220" y1="198" x2="246" y2="282"/>
    <line x1="310" y1="214" x2="246" y2="282"/>
    <line x1="246" y1="282" x2="302" y2="332"/>
  </g>
  <g transform="rotate(7 266 260)" fill="#00a651">
    <circle cx="220" cy="198" r="21"/>
    <circle cx="310" cy="214" r="21"/>
    <circle cx="246" cy="282" r="21"/>
    <circle cx="302" cy="332" r="21"/>
  </g>
</svg>
