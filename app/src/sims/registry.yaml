# Simulation registry. lint.py checks every ```sim block in unit bodies against it.
# plotly: ids in the SIMS table of simulations.js (slider-driven Plotly figures).
# automata: modes of FA.mount in automata.js; a block with `custom: true` picks one via `mode`.
# db: the database engine in db.js; `custom: true`, `engine: db`, `mode: <one of db.modes>` (`tables`, `query`, `expr`, `fds`, `program`, `er`, …).
# ds: the data-structure visualiser in ds.js; `custom: true`, `engine: ds`, `mode: <one of ds.modes>`.
# java: the Java-subset stepper in java.js; a block with `custom: true` and `engine: java` carries the
#   program in `code` (and optionally `stdin`, and `files` — a map of file name to text that seeds the
#   virtual file system the program's File/PrintWriter/Scanner(File) see).
# c: the C-subset stepper in c.js; `custom: true`, `engine: c`, the program in `code` (a whole
#   program, or bare statements that run as the body of main), optionally `stdin`, `args` (the
#   command-line arguments after the program name) and `files` — a map of file name to text: .c
#   files are compiled and linked with the program, .h files are what `#include "name.h"` pastes.
# py: the Python-subset stepper in py.js; `custom: true`, `engine: py`, the program in `code`, optionally
#   `stdin` (one line per input() call), `args` (sys.argv[1:]) and `files` — a map of module paths to
#   source (`geometry.py`, `shapes/__init__.py`) that `import` finds.
# clj: the Clojure-subset evaluator in clj.js; `custom: true`, `engine: clj`, the forms in `code`; the REPL
#   panel lists each top-level form and its value (`repl: false` hides it). Futures and agents run as
#   threads under a deterministic scheduler, so swap! and dosync retries can be seen.
# erl: the Erlang stepper in erl.js; `custom: true`, `engine: erl`. Mode `shell` (the default): a module in
#   `code` (optional) and the expressions typed at the shell in `shell`, each ended by a full stop; the
#   processes it spawns run under a deterministic scheduler, with their mailboxes shown. Mode `shared`:
#   `shared` (variables and start values), `threads` (name -> list of instructions: `v = expr`, `lock m`,
#   `unlock m`, `print expr`) and `schedule` (a string of thread names, or round-robin).
