# Simulation registry. lint.py checks every ```sim block in unit bodies against it.
# plotly: ids in the SIMS table of simulations.js (slider-driven Plotly figures).
# automata: modes of FA.mount in automata.js; a block with `custom: true` picks one via `mode`.
# db: the database engine in db.js; `custom: true`, `engine: db`, `mode: <one of db.modes>` (`tables`, `query`, `expr`, `fds`, `program`, `er`, …).
# ds: the data-structure visualiser in ds.js; `custom: true`, `engine: ds`, `mode: <one of ds.modes>`.
# java: the Java-subset stepper in java.js; a block with `custom: true` and `engine: java` carries the
#   program in `code` (and optionally `stdin`, and `files` — a map of file name to text that seeds the
#   virtual file system the program's File/PrintWriter/Scanner(File) see).
plotly:
  - euler-demo
  - rk4-comparison
  - heat-pde
  - gradient-descent
  - newton-method
  - logistic-regression
  - monte-carlo-pi
  - regularization
  - param-est
  - sgd-loss
  - param-particle
  - param-line
  - param-two-points
  - param-circle
  - param-smiley
  - param-tangent
  - param-area
  - param-concavity
  - param-length-distance
  - param-surface-revolution
  - param-loop
  - polar-point
  - polar-curve
  - polar-tangent
  - polar-area
  - dice-sum-grid
  - empirical-dice
  - venn-counts
  - prob-union
  - sample-space-tree
  - coin-event-grid
  - complement-rule
  - incl-excl-3
  - cond-table
  - cond-venn
  - independence-check
  - draw-replacement
  - total-prob-tree
  - bayes-posterior
  - rare-disease
  - r-precedence
  - r-loan
  - r-function-plot
  - r-recycling
  - r-logical-filter
  - r-matrix-index
  - r-roundoff
  - calc-riemann-sums
  - calc-signed-area
  - calc-antiderivative-family
  - calc-ftc-accumulation
  - calc-net-change
  - calc-substitution
  - calc-parts-area
  - calc-area-between
  - calc-average-value
  - calc-trig-powers
  - calc-trig-sub
  - calc-partial-fractions
  - calc-solid-revolution
  - calc-improper-p
  - calc-sequence-limit
  - calc-geometric-series
  - calc-integral-test
  - calc-comparison
  - calc-alternating
  - calc-ratio-test
  - calc-rearrangement
  - calc-power-series-interval
  - calc-arctan-series
  - calc-taylor-polynomials
  - ds-growth-rates
  - ds-big-o-witness
  - ds-growable-array
  - ds-load-factor
  - ds-sort-lower-bound
automata:
  modes: [run, convert, minimize, derive, tool, graph, proofs]
java:
  modes: [run]
# ds: modes of DS.mount in ds.js (data-structure visualiser); a block carries `mode` plus mode-specific keys
#   (`data`, `ops`, `capacity`, `kind`, `algo`, `edges`, …) — see the header of ds.js.
ds:
  modes: [stack, queue, array-list, linked-list, call-tree, binary-tree, heap, hash-table, bst, avl, sort, graph]
# db: modes of DB.mount in db.js (database engine): sql runs through sql.js over `tables`; the others are own evaluators.
db:
  modes: [sql, ra, fd-closure, fd-keys, fd-cover, decomposition, normal-form, datalog, er]
